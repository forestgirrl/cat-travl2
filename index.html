<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英文旅遊字卡 APP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap">
 
<style>
:root {
  --font-sans: 'Noto Sans', system-ui, sans-serif;
  --font-serif: 'Noto Sans', system-ui, sans-serif;
  --font-mono: 'Noto Sans', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--font-sans); }
:root {
  --brand-btn: #f582ae; --brand-dark: #d4558e; --brand-bg: #fef6e4;
  --brand-headline: #001858; --brand-para: #172c66;
}
.app { width:100%; max-width:390px; margin:0 auto; height:720px; border-radius:36px; overflow:hidden; display:flex; flex-direction:column; position:relative; box-shadow:0 16px 56px rgba(120,80,200,0.25); font-family:var(--font-sans); }
 
/* THEMES */
.t-all    { --c1:#f582ae; --c2:#d4558e; --c3:#fef6e4; --cs:#d4558e; --ct:rgba(245,130,174,.18); }
.t-shop   { --c1:#f472b6; --c2:#be185d; --c3:#fff0f7; --cs:#db2777; --ct:rgba(219,39,119,0.12); }
.t-help   { --c1:#fb923c; --c2:#c2410c; --c3:#fff7ed; --cs:#ea580c; --ct:rgba(234,88,12,0.12); }
.t-nav    { --c1:#34d399; --c2:#065f46; --c3:#f0fdf4; --cs:#059669; --ct:rgba(5,150,105,0.12); }
.t-food   { --c1:#fbbf24; --c2:#b45309; --c3:#fffbeb; --cs:#d97706; --ct:rgba(202,138,4,0.12); }
.t-access { --c1:#60a5fa; --c2:#1d4ed8; --c3:#eff6ff; --cs:#2563eb; --ct:rgba(37,99,235,0.12); }
.t-emergency { --c1:#f87171; --c2:#b91c1c; --c3:#fff5f5; --cs:#dc2626; --ct:rgba(220,38,38,0.12); }
 
.app { background:var(--c3); transition:background 0.35s; }
 
/* HEADER */
.hdr { background:linear-gradient(135deg,var(--c1),var(--c2)); padding:20px 16px 30px; display:flex; align-items:center; justify-content:space-between; position:relative; overflow:hidden; transition:background 0.35s; flex-shrink:0; }
.hdr::before { content:''; position:absolute; top:-28px; right:-18px; width:105px; height:105px; border-radius:50%; background:rgba(255,255,255,0.13); }
.hdr::after  { content:''; position:absolute; bottom:-18px; left:33%; width:62px; height:62px; border-radius:50%; background:rgba(255,255,255,0.09); }
.hdr-title { font-size:24px; font-weight:500; color:white; letter-spacing:0.05em; z-index:1; }
.hdr-btn { width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,0.22); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:1; transition:background 0.15s; flex-shrink:0; }
.hdr-btn:active { background:rgba(255,255,255,0.38); transform:scale(0.93); }
.hdr-btn i { font-size:27px; }
 
/* LIST */
.list-wrap { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.list-wrap::-webkit-scrollbar { display:none; }
 
.card-item { background:white; border-radius:20px; border:0.5px solid rgba(0,0,0,0.06); padding:12px 14px; display:flex; align-items:center; gap:11px; cursor:pointer; transition:box-shadow 0.15s, transform 0.1s; box-shadow:0 2px 10px var(--ct); }
.card-item:active { transform:scale(0.97); box-shadow:0 1px 4px var(--ct); }
 
/* SWIPE-TO-DELETE */
.swipe-row { position:relative; border-radius:20px; overflow:hidden; flex-shrink:0; }
.swipe-delete-btn { position:absolute; left:0; top:0; bottom:0; width:72px; background:linear-gradient(135deg,#ef4444,#b91c1c); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:white; font-size:14px; font-weight:700; cursor:pointer; border-radius:20px 0 0 20px; transform:translateX(-100%); }
.swipe-delete-btn i { font-size:24px; }
.swipe-inner { transform:translateX(0); transition:transform 0.25s cubic-bezier(.4,0,.2,1); will-change:transform; }
.swipe-row.revealed .swipe-inner { transform:translateX(72px); }
.swipe-row.revealed .swipe-delete-btn { transform:translateX(0); }
.card-num { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--c1),var(--c2)); color:white; font-size:19px; font-weight:500; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 3px 8px rgba(0,0,0,0.17); transition:background 0.35s; }
.card-ja  { font-size:21px; font-weight:500; color:#001858; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px; }
.card-zh  { font-size:18px; color:rgba(26,10,61,0.5); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-chev { color:var(--c1); flex-shrink:0; transition:color 0.35s; }
.new-badge { font-size:16px; padding:1px 7px; border-radius:999px; background:var(--c1); color:white; flex-shrink:0; }
 
/* BOTTOM BAR */
.bottom { background:#fff8ed; border-top:0.5px solid rgba(0,24,88,.08); padding:10px 14px 16px; flex-shrink:0; }
.b-input { width:100%; height:44px; border-radius:999px; border:1.5px solid rgba(0,24,88,.18); background:rgba(0,24,88,.05); padding:0 18px; font-size:21px; color:#001858; outline:none; transition:border-color 0.2s, box-shadow 0.2s; }
.b-input::placeholder { color:#172c66; opacity:0.55; }
.b-input:focus { border-color:#f582ae; box-shadow:0 0 0 3px rgba(245,130,174,0.18); background:#fff; }
.b-actions { display:flex; gap:8px; margin-top:8px; }
.b-btn { flex:1; height:44px; border-radius:999px; background:linear-gradient(135deg,#f582ae,#d4558e); border:none; color:#001858; font-size:20px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer; box-shadow:0 4px 14px rgba(245,130,174,0.30); transition:opacity 0.15s, transform 0.1s; }
.b-btn:active { opacity:0.85; transform:scale(0.97); }
.b-btn i { font-size:24px; }
 
/* SIDEBAR */
.sb-overlay { position:absolute; inset:0; background:rgba(10,0,40,0.42); z-index:40; display:none; }
.sb-overlay.open { display:block; }
.sidebar { position:absolute; top:0; left:0; bottom:0; width:72%; max-width:268px; background:linear-gradient(180deg,var(--c1),var(--c2)); z-index:50; transform:translateX(-100%); transition:transform 0.28s ease, background 0.35s; display:flex; flex-direction:column; }
.sidebar.open { transform:translateX(0); }
.sb-hdr { padding:28px 18px 16px; display:flex; align-items:center; justify-content:space-between; }
.sb-title { font-size:26px; font-weight:500; color:white; }
.sb-close { width:32px; height:32px; border-radius:50%; border:none; background:rgba(255,255,255,0.22); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.sb-items { flex:1; overflow-y:auto; padding:8px 12px 24px; display:flex; flex-direction:column; gap:3px; }
.sb-item { padding:11px 16px; border-radius:14px; font-size:21px; font-weight:500; color:rgba(255,255,255,0.8); cursor:pointer; transition:background 0.15s; display:flex; align-items:center; gap:10px; }
.sb-item:hover, .sb-item.active { background:rgba(255,255,255,0.26); color:white; }
 
/* CARD VIEW */
.cv { position:absolute; inset:0; background:var(--c3); z-index:30; display:flex; flex-direction:column; transform:translateX(100%); transition:transform 0.3s ease, background 0.35s; }
.cv.open { transform:translateX(0); }
.cv-hdr { background:linear-gradient(135deg,var(--c1),var(--c2)); padding:20px 16px 46px; display:flex; align-items:center; justify-content:space-between; position:relative; overflow:hidden; flex-shrink:0; transition:background 0.35s; }
.cv-hdr::before { content:''; position:absolute; top:-34px; right:-18px; width:125px; height:125px; border-radius:50%; background:rgba(255,255,255,0.11); }
.cv-badge { padding:4px 13px; border-radius:999px; background:rgba(255,255,255,0.24); font-size:18px; color:white; letter-spacing:0.1em; z-index:1; }
.cv-bubble { margin:-26px 16px 0; background:white; border-radius:24px; padding:20px 20px 14px; box-shadow:0 8px 30px rgba(0,0,0,0.1); text-align:center; z-index:2; position:relative; flex-shrink:0; }
.cv-ja { font-size:26px; font-weight:500; color:#001858; line-height:1.45; margin-bottom:3px; font-family:var(--font-serif); }
.cv-ja-sub { font-size:18px; color:var(--cs); margin-bottom:5px; line-height:1.5; }
.cv-romaji { font-size:16px; color:rgba(26,10,61,0.4); letter-spacing:0.15em; text-transform:uppercase; font-family:var(--font-mono); margin-bottom:10px; }
.cv-div { display:flex; align-items:center; gap:7px; justify-content:center; margin-bottom:8px; opacity:0.22; }
.cv-dline { width:26px; height:1px; background:var(--c2); }
.cv-ddot { width:5px; height:5px; background:var(--c1); transform:rotate(45deg); }
.cv-en { font-size:19px; font-style:italic; color:var(--cs); margin-bottom:4px; }
.cv-zh { font-size:18px; color:rgba(26,10,61,0.5); letter-spacing:0.08em; }
.cv-zh-sub { font-size:17px; color:rgba(26,10,61,0.35); margin-top:2px; }
 
.swipe-area { flex:1; padding:10px 16px 4px; display:flex; flex-direction:column; gap:7px; min-height:0; }
.meme-box { flex:1; border-radius:16px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.09); background:white; min-height:0; display:flex; align-items:center; justify-content:center; }
.meme-box svg { display:block; width:100%; }
.dots { display:flex; justify-content:center; gap:5px; align-items:center; }
.dot { width:6px; height:6px; border-radius:50%; background:rgba(0,0,0,0.13); cursor:pointer; transition:all 0.25s; }
.dot.on { width:20px; border-radius:999px; background:var(--c1); }
 
.cv-actions { display:flex; justify-content:center; gap:28px; padding:8px 0 16px; flex-shrink:0; }
.ac-btn { width:68px; height:68px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; transition:all 0.18s; border:2px solid var(--c1); background:white; color:var(--c1); box-shadow:0 4px 14px var(--ct); }
.ac-btn:active { transform:scale(0.92); }
.ac-btn i { font-size:29px; }
.ac-btn span { font-size:16px; font-weight:500; letter-spacing:0.07em; }
.ac-btn.speaking { background:linear-gradient(135deg,var(--c1),var(--c2)); color:white; border-color:transparent; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 4px 14px var(--ct)} 50%{box-shadow:0 4px 24px var(--cs)} }
 
/* TRANSLATE VIEW */
.tv { position:absolute; inset:0; background:#fef6e4; z-index:35; display:flex; flex-direction:column; transform:translateX(100%); transition:transform 0.3s ease; }
.tv.open { transform:translateX(0); }
.tv-hdr { background:linear-gradient(135deg,#001858,#172c66); padding:20px 16px 24px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; position:relative; overflow:hidden; }
.tv-hdr::before { content:''; position:absolute; top:-24px; right:-14px; width:90px; height:90px; border-radius:50%; background:rgba(255,255,255,0.13); }
.tv-title { font-size:23px; font-weight:500; color:white; z-index:1; }
.dir-btn { padding:5px 12px; border-radius:999px; background:rgba(255,255,255,0.22); border:none; color:white; font-size:19px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:5px; z-index:1; }
.dir-btn i { font-size:21px; }
.tv-msgs { flex:1; overflow-y:auto; padding:14px 14px 8px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.tv-msgs::-webkit-scrollbar { display:none; }
.msg { display:flex; align-items:flex-end; gap:7px; }
.msg.user { flex-direction:row-reverse; }
.msg-bubble { max-width:72%; padding:10px 14px; border-radius:18px; font-size:21px; line-height:1.55; }
.msg.bot  .msg-bubble { background:white; color:#001858; border-radius:18px 18px 18px 4px; box-shadow:0 2px 8px rgba(0,24,88,.08); }
.msg.user .msg-bubble { background:linear-gradient(135deg,#f582ae,#d4558e); color:#001858; border-radius:18px 18px 4px 18px; }
.msg.sys  .msg-bubble { background:transparent; color:rgba(26,10,61,0.4); font-size:19px; box-shadow:none; text-align:center; margin:0 auto; }
.speak-icon { width:30px; height:30px; border-radius:50%; background:#fff8ed; border:0.5px solid rgba(0,24,88,.12); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; box-shadow:0 1px 6px rgba(0,0,0,0.06); }
.speak-icon i { font-size:22px; color:#f582ae; }
.typing { display:flex; gap:4px; align-items:center; padding:12px 14px; }
.typing span { width:7px; height:7px; border-radius:50%; background:#f582ae; animation:bounce 1.2s infinite; }
.typing span:nth-child(2) { animation-delay:0.2s; }
.typing span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
 
.tv-bottom { background:#fff8ed; border-top:0.5px solid rgba(0,24,88,.08); padding:10px 12px 16px; flex-shrink:0; }
.tv-row { display:flex; align-items:flex-end; gap:8px; }
.tv-input { flex:1; min-height:42px; max-height:90px; border-radius:20px; border:1.5px solid rgba(0,24,88,.18); background:rgba(0,24,88,.05); padding:10px 14px; font-size:21px; color:#001858; outline:none; resize:none; font-family:var(--font-sans); transition:border-color 0.2s; }
.tv-input:focus { border-color:#f582ae; background:white; }
.tv-input::placeholder { color:#172c66; opacity:0.55; }
.tv-mic { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#f582ae,#d4558e); border:none; color:#001858; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; box-shadow:0 3px 10px rgba(245,130,174,0.30); transition:all 0.2s; }
.tv-mic.recording { background:linear-gradient(135deg,#f87171,#dc2626); animation:pulse2 1s infinite; }
@keyframes pulse2 { 0%,100%{box-shadow:0 3px 10px rgba(220,38,38,0.3)} 50%{box-shadow:0 3px 20px rgba(220,38,38,0.5)} }
.tv-send { width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#f582ae,#d4558e); border:none; color:#001858; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; box-shadow:0 3px 10px rgba(245,130,174,0.30); }
.tv-send:disabled { opacity:0.4; }
 
 
 
 
/* Brand palette: #fef6e4 bg, #001858 headline, #172c66 paragraph, #f582ae button, #001858 button-text */
body {
  background: radial-gradient(circle at top, #fff8ed 0, #fef6e4 55%, #fdefd0 100%);
  color: #001858;
}
.app {
  background: #fef6e4;
  border: 1px solid rgba(0,24,88,.10);
  box-shadow: 0 24px 80px rgba(0,24,88,.18), 0 0 46px rgba(245,130,174,.14);
}
.t-all,.t-shop,.t-help,.t-nav,.t-food,.t-access,.t-emergency {
  --c1:#f582ae;
  --c2:#d4558e;
  --c3:#fef6e4;
  --cs:#d4558e;
  --ct:rgba(245,130,174,.18);
}
.hdr,
.cv-hdr,
.tv-hdr {
  background: linear-gradient(135deg,#001858,#172c66);
  border-bottom: 1px solid rgba(0,24,88,.12);
}
.hdr::before,
.cv-hdr::before,
.tv-hdr::before {
  background: rgba(245,130,174,.18);
}
.hdr-title,
.tv-title,
.cv-badge,
.sb-title {
  color: #fef6e4;
}
.hdr-btn,
.sb-close,
.dir-btn {
  background: rgba(254,246,228,.16);
  border: 1px solid rgba(254,246,228,.28);
  color: #fef6e4;
}
.list-wrap,
.cv,
.tv {
  background: #fef6e4;
}
.card-item,
.cv-bubble,
.meme-box,
.msg.bot .msg-bubble,
.swipe-inner .card-item {
  background: #fffdf7;
  border: 1px solid rgba(0,24,88,.08);
  box-shadow: 0 4px 18px rgba(0,24,88,.08);
}
.card-ja,
.cv-ja,
.msg.bot .msg-bubble {
  color: #001858;
}
.card-zh,
.cv-romaji,
.cv-zh,
.cv-zh-sub,
.msg.sys .msg-bubble {
  color: #172c66;
}
.cv-ja-sub,
.cv-en {
  color: #d4558e;
}
.bottom,
.tv-bottom {
  background: #fff8ed;
  border-top: 1px solid rgba(0,24,88,.08);
}
.b-input,
.tv-input {
  background: rgba(0,24,88,.05);
  border-color: rgba(0,24,88,.18);
  color: #001858;
}
.b-input:focus,
.tv-input:focus {
  background: #fff;
  border-color: #f582ae;
}
.b-input::placeholder,
.tv-input::placeholder {
  color: #172c66;
  opacity: .55;
}
.b-btn,
.tv-send,
.tv-mic,
.card-num,
.new-badge,
.ac-btn.speaking {
  background: linear-gradient(135deg,#f582ae,#d4558e);
  color: #001858;
}
.ac-btn {
  background: rgba(245,130,174,.12);
  border-color: rgba(245,130,174,.40);
  color: #d4558e;
  box-shadow: 0 4px 16px rgba(245,130,174,.14);
}
.sidebar {
  background: linear-gradient(180deg,#001858,#172c66);
  border-right: 1px solid rgba(0,24,88,.12);
}
.sb-overlay {
  background: rgba(0,24,88,.40);
}
.sb-item {
  color: rgba(254,246,228,.80);
}
.sb-item:hover,
.sb-item.active {
  background: rgba(245,130,174,.22);
  color: #fef6e4;
}
.dot {
  background: rgba(0,24,88,.15);
}
.dot.on {
  background: #f582ae;
}
.speak-icon {
  background: #fff8ed;
  border-color: rgba(0,24,88,.10);
}
.speak-icon i,
.card-chev {
  color: #f582ae;
}
 
 
.product-tools,.try-tools { margin:10px 16px 0; background:rgba(255,255,255,.92); border:1px solid rgba(0,24,88,.10); border-radius:18px; padding:12px; box-shadow:0 4px 14px rgba(0,24,88,.06); }
.tool-title { font-size:19px; color:#001858; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.product-upload { display:flex; align-items:center; justify-content:center; min-height:42px; border:1.5px dashed #f582ae; border-radius:14px; color:#d4558e; font-size:19px; background:rgba(245,130,174,.06); cursor:pointer; }
.product-upload input { display:none; }
.try-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.try-field { display:flex; flex-direction:column; gap:5px; text-align:left; }
.try-field label { font-size:17px; color:rgba(26,10,61,.55); font-weight:700; }
.try-field select { width:100%; height:34px; border-radius:12px; border:1px solid rgba(0,24,88,.18); color:#001858; background:white; padding:0 10px; outline:none; }
.try-choice,.try-buy-row { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:8px; }
.try-buy-row { grid-template-columns:1fr 1fr; }
.mini-btn { min-height:42px; border-radius:999px; border:1px solid #f582ae; background:white; color:#001858; font-size:19px; font-weight:700; cursor:pointer; }
.mini-btn.primary { color:#001858; border-color:transparent; background:linear-gradient(135deg,#f582ae,#d4558e); }
.mini-btn:active { transform:scale(.96); }
.mini-btn .jp { display:block; font-size:17px; font-weight:500; opacity:.72; margin-top:2px; line-height:1.15; }
.try-field label .jp { font-size:17px; font-weight:500; opacity:.65; margin-left:3px; }
.phrase-modal { position:absolute; inset:0; z-index:80; background:rgba(10,0,35,.52); display:none; align-items:center; justify-content:center; padding:24px; }
.phrase-modal.open { display:flex; }
.phrase-card { width:100%; max-width:330px; border-radius:24px; background:white; padding:22px 18px 16px; text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.25); }
.phrase-ja { color:#001858; font-size:29px; line-height:1.45; font-family:var(--font-serif); margin-bottom:10px; }
.phrase-zh { color:#172c66; font-size:21px; line-height:1.55; margin-bottom:16px; }
.phrase-close { width:100%; height:42px; border-radius:999px; border:none; color:#001858; background:linear-gradient(135deg,#f582ae,#d4558e); font-weight:700; cursor:pointer; }
.product-image-card { width:100%; height:100%; min-height:130px; display:flex; align-items:center; justify-content:center; background:rgba(254,246,228,.8); }
.product-image-card img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
 
 
.tv-panels { flex:1; min-height:0; padding:14px; display:grid; grid-template-rows:1fr 1fr; gap:12px; overflow:hidden; }
.talk-panel { min-height:0; border:1px solid rgba(0,24,88,.10); border-radius:22px; background:rgba(255,255,255,.70); padding:12px; display:flex; flex-direction:column; gap:8px; box-shadow:0 8px 26px rgba(0,24,88,.08); }
.talk-head { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#001858; font-size:20px; font-weight:800; }
.talk-tag { padding:4px 10px; border-radius:999px; background:rgba(245,130,174,.18); color:#d4558e; font-size:18px; }
.talk-input { width:100%; min-height:54px; max-height:90px; resize:none; border-radius:16px; border:1px solid rgba(0,24,88,.14); background:rgba(254,246,228,.8); color:#001858; padding:10px 12px; outline:none; font-size:21px; line-height:1.45; }
.talk-input::placeholder { color:#172c66; opacity:.55; }
.talk-result { flex:1; min-height:54px; overflow:auto; border-radius:16px; background:rgba(0,24,88,.05); color:#001858; padding:10px 12px; font-size:22px; line-height:1.55; display:flex; align-items:center; }
.talk-result.empty { color:rgba(0,24,88,.35); font-size:20px; }
.talk-actions { display:flex; gap:8px; }
.talk-btn { flex:1; min-height:38px; border-radius:999px; border:1px solid rgba(245,130,174,.50); background:rgba(245,130,174,.10); color:#001858; font-size:19px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; }
.talk-btn.recording { background:rgba(248,113,113,.22); border-color:#f87171; color:#fecaca; }
.product-preview { width:100%; min-height:150px; max-height:220px; border-radius:16px; overflow:hidden; background:rgba(254,246,228,.8); display:flex; align-items:center; justify-content:center; margin:2px 0 10px; border:1px solid rgba(0,24,88,.08); }
.product-preview img { width:100%; max-height:220px; object-fit:contain; display:block; }
.product-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.product-row .product-upload { min-height:42px; }
 
</style>
</head>
<body>
 
 
 
<div style="padding:12px 0;display:flex;justify-content:center;">
<div class="app t-all" id="app">
 
<!-- SIDEBAR -->
<div class="sb-overlay" id="sbOverlay" onclick="closeSb()"></div>
<div class="sidebar" id="sidebar">
  <div class="sb-hdr">
    <span class="sb-title">情境分類 🌍</span>
    <button class="sb-close" onclick="closeSb()"><i class="ti ti-x" style="font-size:24px"></i></button>
  </div>
  <div class="sb-items" id="sbItems"></div>
</div>
 
 
<!-- TRANSLATE VIEW -->
<div class="tv" id="tv">
  <div class="tv-hdr">
    <button class="hdr-btn" onclick="closeTv()"><i class="ti ti-chevron-left"></i></button>
    <span class="tv-title">即時語音對話翻譯</span>
    <div style="width:36px"></div>
  </div>
  <div class="tv-panels">
    <section class="talk-panel" id="mePanel">
      <div class="talk-head"><span>我</span><span class="talk-tag">中文 → 英文</span></div>
      <textarea class="talk-input" id="meInput" placeholder="我說中文..." rows="2" oninput="autoGrow(this)"></textarea>
      <div class="talk-result empty" id="meResult">英文翻譯會出現在這裡</div>
      <div class="talk-actions">
        <button class="talk-btn" id="meMicBtn" onclick="startPanelMic('me')"><i class="ti ti-microphone"></i> 語音</button>
        <button class="talk-btn" onclick="translatePanel('me')"><i class="ti ti-send"></i> 翻譯並播放</button>
      </div>
    </section>
    <section class="talk-panel" id="otherPanel">
      <div class="talk-head"><span>對方</span><span class="talk-tag">英文 → 中文</span></div>
      <textarea class="talk-input" id="otherInput" placeholder="對方說英文..." rows="2" oninput="autoGrow(this)"></textarea>
      <div class="talk-result empty" id="otherResult">中文翻譯會出現在這裡</div>
      <div class="talk-actions">
        <button class="talk-btn" id="otherMicBtn" onclick="startPanelMic('other')"><i class="ti ti-microphone"></i> 語音</button>
        <button class="talk-btn" onclick="translatePanel('other')"><i class="ti ti-send"></i> 翻譯並播放</button>
      </div>
    </section>
  </div>
</div>
 
<!-- CARD VIEW -->
<div class="cv t-all" id="cv">
  <div class="cv-hdr">
    <button class="hdr-btn" onclick="closeCard()"><i class="ti ti-chevron-left"></i></button>
    <span class="cv-badge" id="cvBadge">🌍 全部</span>
    <div style="width:36px"></div>
  </div>
  <div class="cv-bubble" id="cvBubble"></div>
  <div class="swipe-area"
    ontouchstart="swX=event.touches[0].clientX"
    ontouchend="if(Math.abs(event.changedTouches[0].clientX-swX)>42)navCard(event.changedTouches[0].clientX<swX?1:-1)">
    <div class="meme-box" id="memeBox"></div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="cv-actions">
    <button class="ac-btn" id="speakBtn" onclick="speakCard()">
      <i class="ti ti-volume" id="speakIcon"></i><span>發音</span>
    </button>
    <button class="ac-btn" onclick="openTv()" title="語音對話自動翻譯">
      <i class="ti ti-message-circle"></i><span>對話翻譯</span>
    </button>
  </div>
</div>
 
<!-- LIST VIEW -->
<div class="hdr">
  <button class="hdr-btn" onclick="openSb()"><i class="ti ti-menu-2"></i></button>
  <span class="hdr-title" id="hdrTitle">英文旅遊字卡</span>
  <button class="hdr-btn" onclick="openTv()" title="語音對話自動翻譯"><i class="ti ti-message-dots"></i></button>
</div>
<div class="list-wrap" id="listWrap"></div>
<div class="bottom">
  <input class="b-input" id="bInput" placeholder="✍️ 輸入想說的話，新增字卡..." onkeypress="if(event.key==='Enter')handleGen()">
  <div class="b-actions">
    <button class="b-btn" onclick="handleGen()"><i class="ti ti-sparkles"></i> 生成字卡</button>
  </div>
</div>
 
<div class="phrase-modal" id="phraseModal" onclick="if(event.target===this)closePhraseModal()">
  <div class="phrase-card">
    <div class="phrase-ja" id="phraseModalJa"></div>
    <div class="phrase-zh" id="phraseModalZh"></div>
    <button class="phrase-close" onclick="closePhraseModal()">確定</button>
  </div>
</div>
</div><!-- app -->
</div>
 
<script>
let swX=0, cardIdx=0, selCat='All', tvDir='zh-en', isRecording=false, isSpeaking=false;
let recognition=null;
 
const themes={
  'All':'t-all','Shopping':'t-shop','Help':'t-help','Navigation':'t-nav',
  'Dining':'t-food','Accessibility':'t-access','Emergency':'t-emergency','Other':'t-all'
};
const emoji={ 'All':'🌍','Shopping':'🛍️','Help':'🆘','Navigation':'🗺️','Dining':'🍽️','Accessibility':'♿','Emergency':'🚨','Other':'💬' };
const cats=['All','Shopping','Help','Navigation','Dining','Accessibility','Emergency','Other'];
 
let cards=[
  {id:1,cat:'Shopping',ja:'Can I try this on?',en:'Can I try this on?',zh:'我可以試穿嗎？'},
  {id:2,cat:'Shopping',ja:'How much is this?',en:'How much is this?',zh:'這個多少錢？'},
  {id:3,cat:'Shopping',ja:'Can I pay by credit card?',en:'Can I pay by credit card?',zh:'可以刷信用卡嗎？'},
  {id:21,cat:'Shopping',ja:'Do you have this item?',en:'Do you have this item?',zh:'請問有這個商品嗎？',productQuery:true},
  {id:4,cat:'Help',ja:'Can you help me?',en:'Can you help me?',zh:'請問可以幫助我嗎？'},
  {id:5,cat:'Help',ja:'I cannot speak much English.',en:'I cannot speak much English.',zh:'我不太會說英文'},
  {id:6,cat:'Help',ja:'Can you speak English?',en:'Can you speak English?',zh:'你會說英文嗎？'},
  {id:7,cat:'Navigation',ja:'Where is the restroom?',en:'Where is the restroom?',zh:'洗手間在哪裡？'},
  {id:8,cat:'Navigation',ja:'Where is the station?',en:'Where is the station?',zh:'車站在哪裡？'},
  {id:9,cat:'Navigation',ja:'I want to go to this address.',en:'I want to go to this address.',zh:'我想去這個地址'},
  {id:10,cat:'Dining',ja:'Ice water, please.',en:'Ice water, please.',zh:'請給我冰水'},
  {id:11,cat:'Dining',ja:"I'm vegetarian. Any dishes without meat or fish?",en:"I'm vegetarian. Any dishes without meat or fish?",zh:'我吃素食，有無肉魚料理嗎？',isNew:true},
  {id:12,cat:'Dining',ja:'What do you recommend?',en:'What do you recommend?',zh:'你們的招牌是什麼？'},
  {id:13,cat:'Dining',ja:'I have allergies. Does this contain XX?',en:'I have allergies. Does this contain XX?',zh:'我有過敏，這裡面有〇〇嗎？'},
  {id:14,cat:'Accessibility',ja:'Where is the elevator?',en:'Where is the elevator?',zh:'電梯在哪裡？'},
  {id:15,cat:'Accessibility',ja:'Could you help me put my luggage in the overhead bin?',en:'Could you help me put my luggage in the overhead bin?',zh:'不好意思，能幫我把行李放上置物架嗎？',ja_sub:'I have a disability in my left hand and cannot lift heavy objects.',zh_sub:'我的左手肢障，無法舉重物'},
  {id:16,cat:'Emergency',ja:'Help me please!',en:'Help me please!',zh:'救命！'},
  {id:17,cat:'Emergency',ja:'Please call an ambulance!',en:'Please call an ambulance!',zh:'請叫救護車！'},
  {id:18,cat:'Emergency',ja:'Please call the police!',en:'Please call the police!',zh:'請叫警察！'},
  {id:19,cat:'Other',ja:'Could you take a photo for me?',en:'Could you take a photo for me?',zh:'可以幫我拍照嗎？'},
  {id:20,cat:'Other',ja:'Could you tell me the Wi-Fi password?',en:'Could you tell me the Wi-Fi password?',zh:'請告訴我 Wi-Fi 密碼'},
];
 
// Smart SVGs for travel phrase cards
function svgEscape(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}
 
 
function firstEmoji(value){
  const match = String(value || '').match(/\p{Extended_Pictographic}/u);
  return match ? match[0] : '🧳';
}
 
function isTryOnCard(card){
  const text = [card.zh, card.ja, card.en].filter(Boolean).join(' ');
  return card.id === 1 || card.tryOn === true || /我可以試穿嗎|Can I try this on/i.test(text);
}
 
function isProductQueryCard(card){
  const text = [card.zh, card.ja, card.en].filter(Boolean).join(' ');
  return card.productQuery === true || /請問有這個商品嗎|Do you have this item/i.test(text);
}
 
function showPhraseModal(zh, ja){
  const modal = document.getElementById('phraseModal');
  if(!modal) {
    alert(ja + '\n' + zh);
    return;
  }
  document.getElementById('phraseModalJa').textContent = ja;
  document.getElementById('phraseModalZh').textContent = zh;
  modal.classList.add('open');
}
 
function closePhraseModal(){
  const modal = document.getElementById('phraseModal');
  if(modal) modal.classList.remove('open');
}
 
function handleProductImage(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const list = fc();
  const card = list[cardIdx];
  if(!card) return;
  const reader = new FileReader();
  reader.onload = () => {
    card.productImage = reader.result;
    renderCard();
  };
  reader.readAsDataURL(file);
}
 
function renderProductTools(card){
  if(!isProductQueryCard(card)) return '';
  const preview = card.productImage
    ? `<div class="product-preview"><img src="${card.productImage}" alt="商品圖片"></div>`
    : `<label class="product-upload">
        <input type="file" accept="image/*" onchange="handleProductImage(this)">
        <span>上傳商品圖片</span>
      </label>`;
  const actions = card.productImage
    ? `<div class="product-row">
        <label class="product-upload"><input type="file" accept="image/*" onchange="handleProductImage(this)"><span>新增商品</span></label>
        <label class="product-upload"><input type="file" accept="image/*" onchange="handleProductImage(this)"><span>更換商品</span></label>
      </div>`
    : '';
  return `<div class="product-tools">
    <div class="tool-title"><i class="ti ti-photo-plus"></i> 選擇你要詢問的商品圖片</div>
    ${preview}
    ${actions}
  </div>`;
}
 
function renderTryOnTools(card){
  if(!isTryOnCard(card)) return '';
  const shoe = ['','22','22.5','23','23.5','24','24.5','25','25.5','26','26.5','27','27.5','28','28.5','29'];
  const clothes = ['','XS','S','M','L','XL','2XL','3XL'];
  const opts = values => values.map(v => `<option value="${v}">${v || 'Please select'}</option>`).join('');
  return `<div class="try-tools">
    <div class="tool-title"><i class="ti ti-hanger"></i> 試穿尺寸 / Try-on Size</div>
    <div class="try-row">
      <div class="try-field"><label>👟 鞋號 <span class="jp">Shoe Size</span></label><select>${opts(shoe)}</select></div>
      <div class="try-field"><label>👕 衣服尺寸 <span class="jp">Clothing Size</span></label><select>${opts(clothes)}</select></div>
    </div>
    <div class="try-choice">
      <button class="mini-btn" onclick="showPhraseModal('請幫我拿大一點','Could I get a bigger size, please?')">太小<span class="jp">Too small</span></button>
      <button class="mini-btn" onclick="showPhraseModal('這個尺寸剛好，我考慮一下','This size fits well. Let me think about it.')">剛好<span class="jp">Just right</span></button>
      <button class="mini-btn" onclick="showPhraseModal('請幫我拿小一點','Could I get a smaller size, please?')">太大<span class="jp">Too big</span></button>
    </div>
    <div class="try-buy-row">
      <button class="mini-btn" onclick="showPhraseModal('我要購買這個，謝謝','I will take this one. Thank you!')">購買<span class="jp">Buy</span></button>
      <button class="mini-btn" onclick="showPhraseModal('我覺得不太適合我，謝謝你','I don\'t think it suits me. Thank you.')">不用了<span class="jp">No thanks</span></button>
    </div>
  </div>`;
}
 
function pickCardScene(card){
  const raw = [card.zh, card.ja, card.en, card.cat].filter(Boolean).join(' ').toLowerCase();
  const has = (...words) => words.some(word => raw.includes(String(word).toLowerCase()));
  const scene = (icons, caption, bg, fg, accent) => ({ icons, caption, bg, fg, accent });
 
  if(has('成功','できた','成功した','did i succeed','succeed','順利','完成','過關')){
    return scene('✅🎉', '任務成功，旅程繼續前進', '#f0fdf4', '#15803d', '#22c55e');
  }
  if(has('哭','難過','傷心','泣','cry','sad','qaq','委屈')){
    return scene('😢🧻', '先把心情說出來也很重要', '#eef2ff', '#4338ca', '#818cf8');
  }
  if(has('餓','肚子','お腹','hungry','吃','餐','飯','拉麵','壽司')){
    return scene('🍜🍙', '補充能量，再繼續旅行', '#fffbeb', '#b45309', '#f59e0b');
  }
  if(has('渴','水','飲料','口渴','喉','thirst','water')){
    return scene('🥤💧', '先喝點水，身體會感謝你', '#eff6ff', '#1d4ed8', '#60a5fa');
  }
  if(has('蟑螂','gokiburi','cockroach','房間','旅館','飯店','hotel','room')){
    return scene('🏨🛎️', '住宿狀況要清楚說明', '#f5f3ff', '#6d28d9', '#a78bfa');
  }
  if(has('廁所','洗手間','toilet','restroom','トイレ')){
    return scene('🚻🧭', '找到設施，安心很多', '#f0fdf4', '#047857', '#34d399');
  }
  if(has('迷路','地址','車站','電車','地鐵','方向','在哪','どこ','station','lost','address','map')){
    return scene('🗺️🧭', '確認方向，慢慢找路', '#ecfeff', '#0e7490', '#22d3ee');
  }
  if(has('幫','救','協助','help','不舒服','痛','醫院','警察','緊急')){
    return scene('🆘🙋‍♀️', 'Just ask — help is on the way', '#fff7ed', '#c2410c', '#fb923c');
  }
  if(has('買','多少錢','價格','信用卡','付款','購物','試穿','buy','price','card')){
    return scene('🛍️💳', 'Ask before you buy', '#fdf2f8', '#be185d', '#f472b6');
  }
  if(has('照片','拍照','相機','photo','picture','写真')){
    return scene('📷✨', '把旅途片刻留下來', '#fef6e4', '#d4558e', '#f582ae');
  }
  if(has('wifi','wi-fi','密碼','password','網路')){
    return scene('📶🔑', '連上網路就比較安心', '#eef2ff', '#4338ca', '#818cf8');
  }
  if(has('累','休息','睡','疲','tired','rest')){
    return scene('🪑🌙', '休息一下也是旅行的一部分', '#f8fafc', '#475569', '#94a3b8');
  }
 
  if(card.cat === '購物') return scene('🛍️💸', '旅遊購物魂永不滅', '#fce7f3', '#be185d', '#f472b6');
  if(card.cat === '求助') return scene('🆘🙋‍♀️', '需要幫忙就大方說', '#fff7ed', '#c2410c', '#fb923c');
  if(card.cat === '尋路') return scene('🗺️🧭', '下一站會找到的', '#f0fdf4', '#047857', '#34d399');
  if(card.cat === '餐廳') return scene('🍣🥢', '日本美食探索中', '#fffbeb', '#b45309', '#f59e0b');
  if(card.cat === '身障需求') return scene('♿💙', '把需求說清楚，旅程更順', '#eff6ff', '#1d4ed8', '#60a5fa');
  if(card.cat === '緊急') return scene('🚨📢', '重要狀況要直接表達', '#fff5f5', '#b91c1c', '#f87171');
  return scene('🧳🌙', '旅行中的一句魔法咒語', '#fef6e4', '#d4558e', '#f582ae');
}
 
function getMeme(card,w,h){
  const s = pickCardScene(card);
  const zh = svgEscape(card.zh || '');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${w}" height="${h}" fill="${s.bg}" rx="4"/>
    <circle cx="${w*.18}" cy="${h*.18}" r="${h*.18}" fill="${s.accent}" opacity=".16"/>
    <circle cx="${w*.84}" cy="${h*.28}" r="${h*.28}" fill="${s.accent}" opacity=".12"/>
    <text x="${w/2}" y="${h*.43}" text-anchor="middle" font-size="${h*.36}" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">${firstEmoji(s.icons)}</text>
    <text x="${w/2}" y="${h*.73}" text-anchor="middle" font-size="${h*.1}" fill="${s.fg}" font-family="sans-serif" font-weight="700">${zh}</text>
  </svg>`;
}
 
function setTheme(cat){
  const t=themes[cat]||'t-all';
  const app=document.getElementById('app');
  const cv=document.getElementById('cv');
  Object.values(themes).forEach(x=>{app.classList.remove(x);cv.classList.remove(x);});
  app.classList.add(t); cv.classList.add(t);
}
 
function fc(){ return selCat==='All'?cards:cards.filter(c=>c.cat===selCat); }
 
function renderSb(){
  document.getElementById('sbItems').innerHTML=cats.map(c=>`
    <div class="sb-item ${c===selCat?'active':''}" onclick="selectCat('${c}')">
      <span>${emoji[c]||''}</span><span>${c}</span>
    </div>`).join('');
}
 
function renderList(){
  document.getElementById('hdrTitle').textContent='英文旅遊字卡';
  const list=fc();
  document.getElementById('listWrap').innerHTML=list.length===0
    ?`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:rgba(0,24,88,0.25);gap:10px"><i class="ti ti-book-2" style="font-size:51px;opacity:0.5"></i><p style="font-size:21px">這個分類還沒有字卡</p><p style="font-size:19px;opacity:0.7">在下方輸入來新增 ✨</p></div>`
    :list.map((card,i)=>`
      <div class="swipe-row" id="swrow-${card.id}">
        <div class="swipe-delete-btn" onclick="deleteCard(${card.id})">
          <i class="ti ti-trash"></i>刪除
        </div>
        <div class="swipe-inner">
          <div class="card-item" onclick="openCard(${i})">
            <div class="card-num">${i+1}</div>
            <div style="flex:1;min-width:0;">
              <div class="card-ja">
                <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${card.ja}</span>
                ${card.isNew?'<span class="new-badge">NEW</span>':''}
              </div>
              <div class="card-zh">${card.zh}</div>
            </div>
            <div class="card-chev"><i class="ti ti-chevron-right" style="font-size:24px"></i></div>
          </div>
        </div>
      </div>`).join('');
  initSwipeRows();
}
 
function renderCard(){
  const list=fc(); const card=list[cardIdx];
  if(!card) return;
  document.getElementById('cvBadge').textContent=`${emoji[card.cat]||''} ${card.cat}`;
  document.querySelectorAll('.product-tools,.try-tools').forEach(el=>el.remove());
  document.getElementById('cvBubble').innerHTML=`
    <div class="cv-ja">${card.ja}</div>
    ${card.ja_sub?`<p class="cv-ja-sub">${card.ja_sub}</p>`:''}
    <div class="cv-div"><div class="cv-dline"></div><div class="cv-ddot"></div><div class="cv-dline"></div></div>
    <p class="cv-zh">${card.zh}</p>
    ${card.zh_sub?`<p class="cv-zh-sub">${card.zh_sub}</p>`:''}
  `;
  document.getElementById('cvBubble').insertAdjacentHTML('afterend', renderProductTools(card) + renderTryOnTools(card));
  document.getElementById('memeBox').innerHTML=getMeme(card,320,130);
  setTheme(card.cat);
  const list2=fc();

function initSwipeRows(){
  document.querySelectorAll('.swipe-row').forEach(row=>{
    const inner=row.querySelector('.swipe-inner');
    let startX=0, startY=0, dragging=false, revealed=false;
 
    function reveal(){ row.classList.add('revealed'); revealed=true; }
    function hide(){ row.classList.remove('revealed'); revealed=false; }
 
    // close all other rows
    function closeOthers(){
      document.querySelectorAll('.swipe-row.revealed').forEach(r=>{ if(r!==row){ r.classList.remove('revealed'); } });
    }
 
    // Touch
    row.addEventListener('touchstart', e=>{
      startX=e.touches[0].clientX; startY=e.touches[0].clientY; dragging=false;
    },{passive:true});
    row.addEventListener('touchmove', e=>{
      const dx=e.touches[0].clientX-startX;
      const dy=e.touches[0].clientY-startY;
      if(!dragging && Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)) dragging=true;
    },{passive:true});
    row.addEventListener('touchend', e=>{
      const dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)<6 && !revealed) return; // tap passthrough
      if(dx>36){ closeOthers(); reveal(); }
      else if(dx<-20){ hide(); }
    });
 
    // Mouse (desktop)
    row.addEventListener('mousedown', e=>{ startX=e.clientX; });
    row.addEventListener('mouseup', e=>{
      const dx=e.clientX-startX;
      if(dx>30){ closeOthers(); reveal(); }
      else if(dx<-15){ hide(); }
    });
  });
 
  // tap anywhere outside to close all
  document.getElementById('listWrap').addEventListener('touchstart', e=>{
    if(!e.target.closest('.swipe-row')){
      document.querySelectorAll('.swipe-row.revealed').forEach(r=>r.classList.remove('revealed'));
    }
  },{passive:true});
}

async function translatePanel(who){
  const isMe = who === 'me';
  const input = document.getElementById(isMe ? 'meInput' : 'otherInput');
  const result = document.getElementById(isMe ? 'meResult' : 'otherResult');
  const text = (input.value || '').trim();
  if(!text) return;
  result.classList.remove('empty');
  result.textContent = '翻譯中...';
  try{
    const translated = await googleTranslate(text, isMe ? 'zh-TW' : 'en', isMe ? 'en' : 'zh-TW');
    result.textContent = translated;
    speakText(translated, isMe ? 'en-US' : 'zh-TW');
  }catch(e){
    result.textContent = '翻譯失敗，請確認網路連線後再試。';
  }
}
function startPanelMic(who){
  if(isRecording){ stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('這個瀏覽器不支援語音輸入，請用 Chrome 或 Safari。'); return; }
  const isMe = who === 'me';
  const input = document.getElementById(isMe ? 'meInput' : 'otherInput');
  const btn = document.getElementById(isMe ? 'meMicBtn' : 'otherMicBtn');
  recognition = new SR();
  recognition.lang = isMe ? 'zh-TW' : 'en-US';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onstart = () => {
    isRecording = true;
    if(btn){ btn.classList.add('recording'); btn.innerHTML = '<i class="ti ti-player-stop"></i> 聆聽中'; }
  };
  recognition.onresult = event => {
    let finalText = '';
    let interimText = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal) finalText += transcript;
      else interimText += transcript;
    }
    input.value = finalText || interimText;
    autoGrow(input);
    if(finalText) translatePanel(who);
  };
  recognition.onerror = () => {
    if(input && !input.value) input.placeholder = '沒有辨識到聲音，請再試一次...';
  };
  recognition.onend = () => {
    isRecording = false;
    resetMicButton('me');
    resetMicButton('other');
  };
  recognition.start();
}
function resetMicButton(who){
  const btn = document.getElementById(who === 'me' ? 'meMicBtn' : 'otherMicBtn');
  if(btn){ btn.classList.remove('recording'); btn.innerHTML = '<i class="ti ti-microphone"></i> 語音'; }
}

  u.lang=lang; u.rate=0.88;

}

function findWord(text){
  return wordMap.find(([zh])=>text.includes(zh));
}
 
function inferCategory(text){
  const rule=generatedPhraseRules.find(r=>r.re.test(text));
  if(rule)return rule.cat;
  if(/餓|渴/.test(text))return '餐廳';
  if(/哭|難過|害怕|不舒服|痛|累|休息|吐/.test(text))return '求助';
  if(/房間|飯店|旅館|酒店|入住|退房|鑰匙|床|熱水|冷氣|空調|毛巾|蟑螂|蟲/.test(text))return '住宿';
  if(/買|試|錢|價格|刷卡|退稅|尺寸/.test(text))return '購物';
  if(/幫|協助|日文|英文|說/.test(text))return '求助';
  if(/哪裡|在哪|地址|方向|車站|地鐵|公車|迷路/.test(text))return '尋路';
  if(/吃|餐|水|菜|過敏|素食|推薦|餓|渴/.test(text))return '餐廳';
  if(/電梯|輪椅|行李|置物|障礙|身障/.test(text))return '身障需求';
  if(/救|醫院|警察|緊急/.test(text))return '緊急';
  return selCat==='All'?'Other':selCat;
}
 
function translateNewCard(raw){
  const text=String(raw||'').trim();
  const normalized=text.replace(/[。！？!?，,\s]/g,'');
  const direct=directPhraseMap.find(([zh])=>normalized.includes(zh.replace(/[。！？!?，,\s]/g,'')));
  if(direct)return {id:Date.now(),cat:selCat==='All'?direct[4]:selCat,ja:direct[1],rm:direct[2],en:direct[3],zh:text,isNew:true};
 
  const exact=cards.find(c=>c.zh===text || text.includes(c.zh) || c.zh.includes(text));
  if(exact)return {...exact, id:Date.now(), zh:text, isNew:true};
  const rule=generatedPhraseRules.find(r=>r.re.test(text));
  if(rule)return {id:Date.now(),cat:selCat==='All'?rule.cat:selCat,ja:rule.ja,rm:rule.rm,en:rule.en,zh:text,isNew:true};
 
  const cat=inferCategory(text);
  const word=findWord(text);
  const enWord=word?word[3]:'this';
 
  if(/有/.test(text) && /房間|裡|內/.test(text)){
    return {id:Date.now(),cat,ja:`There is a ${enWord} in my room.`,en:`There is a ${enWord} in my room.`,zh:text,isNew:true};
  }
  if(/壞|不能用|故障/.test(text)){
    return {id:Date.now(),cat,ja:`The ${enWord} is broken.`,en:`The ${enWord} is broken.`,zh:text,isNew:true};
  }
  if(/沒有|沒/.test(text)){
    return {id:Date.now(),cat,ja:`There is no ${enWord}.`,en:`There is no ${enWord}.`,zh:text,isNew:true};
  }
  if(/哪裡|在哪/.test(text)){
    return {id:Date.now(),cat,ja:`Where is the ${enWord}?`,en:`Where is the ${enWord}?`,zh:text,isNew:true};
  }
  if(/請給我|我要|想要|麻煩給/.test(text)){
    return {id:Date.now(),cat,ja:`I would like ${enWord}, please.`,en:`I would like ${enWord}, please.`,zh:text,isNew:true};
  }
  if(/可以|能不能|能|請/.test(text)){
    return {id:Date.now(),cat,ja:`Could you help me with ${enWord}?`,en:`Could you help me with ${enWord}?`,zh:text,isNew:true};
  }
  return {id:Date.now(),cat,ja:'I would like to say this in English.',en:'I would like to say this in English.',zh:text,isNew:true};
}
 
async function googleTranslate(text, from, to){
  const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+
    encodeURIComponent(from)+'&tl='+encodeURIComponent(to)+'&dt=t&q='+encodeURIComponent(text);
  const res=await fetch(url);
  if(!res.ok) throw new Error('Google Translate failed');
  const data=await res.json();
  return (data?.[0]||[]).map(part=>part?.[0]||'').join('').trim();
}
 
function cleanGeneratedJa(ja, raw){
  const text=String(ja||'').trim();
  if(!text) return text;
  const suspicious=[
    'I would like to say this in English',
    'please confirm this',
    'I want to say this in English'
  ];
  if(suspicious.some(piece=>text.includes(piece))){
    throw new Error('Template translation rejected for: '+raw);
  }
  return text;
}
 
async function requestGptCard(raw){
  const local=translateNewCard(raw);
  const enResult=await Promise.allSettled([
    googleTranslate(raw,'zh-TW','en')
  ]);
  const en=enResult[0].status==='fulfilled' ? enResult[0].value : '';
  if(!en) throw new Error('Google Translate returned no English');
  return {
    id:Date.now(),
    cat:local.cat||inferCategory(raw),
    ja:en,
    en:en||local.en||raw,
    zh:raw,
    isNew:true
  };
}
 
async function sendPrompt(promptText){
  const raw=String(promptText||'').replace(/^幫我把這句話加入字卡：/,'').trim();
  if(!raw)return;
  const input=document.getElementById('bInput');
  const oldPlaceholder=input?input.placeholder:'';
  if(input){ input.disabled=true; input.placeholder='Google 翻譯中...'; }
  let newCard;
  try{
    newCard=await requestGptCard(raw);
  }catch(error){
    console.warn('Google translation failed, using local fallback:', error);
    newCard=translateNewCard(raw);
    alert('Google 翻譯暫時失敗，已先用離線規則產生字卡。請確認本機 網路連線是否正常。');
  }finally{
    if(input){ input.disabled=false; input.placeholder=oldPlaceholder; input.value=''; }
  }
  cards.push(newCard);
  selCat=newCard.cat;
  cardIdx=fc().length-1;
  setTheme(selCat);
  renderSb();
  renderList();
  openCard(cardIdx);
  saveUserCards();
}
 
// PERSISTENT STORAGE
const STORAGE_KEY = 'user_added_cards';
 
async function saveUserCards(){
  const userCards = cards.filter(c => c.isNew);
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(userCards));
  } catch(e) {
    console.warn('Storage save failed:', e);
  }
}
 
async function loadUserCards(){
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if(result && result.value){
      const saved = JSON.parse(result.value);
      if(Array.isArray(saved) && saved.length > 0){
        // Avoid duplicates by id
        const existingIds = new Set(cards.map(c => c.id));
        saved.forEach(c => { if(!existingIds.has(c.id)) cards.push(c); });
      }
    }
  } catch(e) {
    console.warn('Storage load failed:', e);
  }
}
 
function deleteCard(id){
  cards = cards.filter(c => c.id !== id);
  renderList();
  saveUserCards();
}
 
async function init(){
  await loadUserCards();
  setTheme('All'); renderSb(); renderList();
}
init();
